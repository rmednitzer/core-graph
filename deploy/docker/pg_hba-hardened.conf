# Hardened host-based authentication for core-graph.
#
# Order matters: PostgreSQL uses the FIRST matching line. The file is written
# so that every TCP path is TLS-only and everything that matches nothing
# earlier is rejected explicitly, rather than falling through to the server
# default. The reference production deployment (a loopback-only PostgreSQL 18
# host) runs the same shape: purpose-scoped roles, no cleartext TCP, and a
# final `reject` catch-all so an unlisted role or address fails closed.
#
# Cleartext TCP is refused outright. Under the previous layout a plain `host`
# line preceded the `hostssl` lines, which made the TLS lines unreachable and
# allowed non-TLS connections despite `ssl_min_protocol_version = TLSv1.3`
# in postgresql-hardened.conf.
#
# TYPE      DATABASE        USER            ADDRESS         METHOD
local       all             all                             scram-sha-256
hostnossl   all             all             0.0.0.0/0       reject
hostnossl   all             all             ::/0            reject
hostssl     all             all             0.0.0.0/0       scram-sha-256
hostssl     all             all             ::/0            scram-sha-256
# Explicit fail-closed catch-all. Unreachable by construction today (every
# TCP path is matched above), kept so that a future edit that narrows an
# address range or a database/user column fails closed instead of falling
# through to the server default.
host        all             all             all             reject
