name: Eval

# Eval runs against a populated DB. It runs on PRs as well as main pushes (and
# nightly + on-demand) so an eval-workflow or full-stack regression is caught in
# review rather than only post-merge — the same blind spot that hid the PG18
# postgres-volume break. Without an embedding backend (CG_EMBEDDING_PROVIDER=none
# in CI) the retrieval/drift steps skip cleanly; the unit-test layer
# (tests/test_eval_runner.py, tests/test_embedding_drift.py) covers the pure
# helpers via the standard test workflow.
on:
  schedule:
    - cron: '17 3 * * *'  # 03:17 UTC nightly
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  retrieval-eval:
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    permissions:
      contents: read
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: cg_admin
      PGPASSWORD: cg_dev_only
      PGDATABASE: core_graph
      CG_PG_DSN: postgresql://cg_admin:cg_dev_only@localhost:5432/core_graph
      CG_NATS_URL: nats://localhost:4222
      CG_VALKEY_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: pip install '.[test]'
      - name: Start Docker Compose stack
        run: docker compose -f deploy/docker/docker-compose.yml up -d
      - name: Wait for PostgreSQL
        run: |
          ready=false
          for _ in $(seq 1 30); do
            if docker compose -f deploy/docker/docker-compose.yml exec -T postgres pg_isready -U cg_admin -d core_graph 2>/dev/null; then
              ready=true; break
            fi
            sleep 2
          done
          [ "$ready" = true ] || { echo "PostgreSQL did not become ready in time" >&2; exit 1; }
      - name: Apply migrations and seeds
        run: |
          sudo apt-get update -qq && sudo apt-get install -y postgresql-client
          for f in $(ls schema/migrations/*.sql | sort); do
            psql -v ON_ERROR_STOP=1 -f "$f"
          done
          for f in $(ls schema/seed/*.sql 2>/dev/null | sort); do
            psql -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Run retrieval eval
        run: |
          python scripts/eval/run_retrieval_eval.py \
            --golden tests/eval/golden/retrieval_v1.jsonl \
            --report-md eval-report.md \
            > eval-report.json
      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: retrieval-eval-report
          path: |
            eval-report.json
            eval-report.md
      - name: RLS-aware retrieval correctness (hard fail)
        run: |
          rc=0
          pytest tests/eval/test_rls_retrieval_correctness.py -v || rc=$?
          # pytest exit 5 = "no tests collected": this suite module-skips when
          # there is no embedding backend (CG_EMBEDDING_PROVIDER=none in CI), so
          # running it alone collects zero items. Treat 5 as a pass; a genuine
          # RLS regression surfaces as exit 1.
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 5 ]; then exit "$rc"; fi
      - name: Embedding drift detection
        run: |
          set +e
          python scripts/bench/embedding_drift.py \
            --baseline tests/eval/baseline_embedding_dist.npz \
            --sample-size 10000 \
            > drift-report.json
          rc=$?
          cat drift-report.json
          if [ "$rc" -ne 0 ]; then
            echo "drift exit code $rc"
            exit "$rc"
          fi
      - name: Upload drift report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: embedding-drift-report
          path: drift-report.json
      - name: Tear down stack
        if: always()
        run: docker compose -f deploy/docker/docker-compose.yml down -v
