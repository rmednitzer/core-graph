name: Release

# Build, push, sign, and attest the container images on a published release.
#
# This is the supply-chain "produce" half of the security story (the
# "verify" half — Trivy/Grype/SBOM/secret scanning — lives in security.yml
# and runs on every PR). It is gated to releases so it never runs on PRs:
#
#   - Images are pushed to GHCR by immutable digest.
#   - Each image is signed with cosign keyless (Sigstore Fulcio + Rekor
#     transparency log), matching the evidence architecture already used by
#     this project (evidence/signing/sign.py, Rekor).
#   - SLSA build provenance is attested for each image via
#     actions/attest-build-provenance, so consumers can verify the image was
#     built from this repo by this workflow.
#
# Verify a released image:
#   cosign verify \
#     --certificate-identity-regexp "https://github.com/${REPO}/.github/workflows/release.yml@.*" \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     ghcr.io/<owner>/core-graph@sha256:<digest>
#   gh attestation verify oci://ghcr.io/<owner>/core-graph@sha256:<digest> --repo <owner>/core-graph

on:
  release:
    types: [published]

permissions: {}

jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write       # push to GHCR
      id-token: write       # cosign keyless + provenance OIDC
      attestations: write   # actions/attest-build-provenance
    strategy:
      matrix:
        include:
          - name: core-graph
            dockerfile: deploy/docker/Dockerfile.app
            # Pure-Python app on python:3.13-slim (multi-arch base) — build for
            # amd64 + arm64 (e.g. Hetzner/Ampere, Graviton).
            platforms: linux/amd64,linux/arm64
          - name: core-graph-postgres
            dockerfile: deploy/docker/Dockerfile.postgres
            # apache/age publishes amd64 only; keep this image single-arch
            # until an arm64 AGE base is available.
            platforms: linux/amd64
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.name }}
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ github.event.release.tag_name }}
          # SBOM + provenance are produced separately below (cosign + attest)
          # so the build itself stays reproducible and provider-neutral.
          provenance: false

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless, Rekor-logged)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes \
            "ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}@${DIGEST}"

      - name: Attest SLSA build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
