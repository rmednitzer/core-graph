name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * 0"

permissions: {}

jobs:
  sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          format: cyclonedx-json
          artifact-name: sbom.cyclonedx.json
      # SPDX rendition alongside the CycloneDX one: the NOTICE points readers
      # at the SBOM for license terms, and SPDX is the expression-bearing
      # format that the license gate below complements.
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          format: spdx-json
          artifact-name: sbom.spdx.json

  # License-policy gate (audit 2026-06-01 § 6.5): scan the *runtime*
  # dependency closure only — dev tooling (e.g. GPL-licensed yamllint) is not
  # distributed, so installing extras here would produce false failures.
  # Policy and rationale live in scripts/license_gate.py.
  license-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install runtime dependencies only
        run: pip install .
      - name: Run license gate
        run: python scripts/license_gate.py --report license-report.json
      - name: Upload license report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: license-report.json
          path: license-report.json

  cve-scan:
    runs-on: ubuntu-latest
    needs: sbom
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom.cyclonedx.json
      - uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          sbom: sbom.cyclonedx.json
          fail-build: true
          severity-cutoff: high

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@30d5bb91af1a771378349dbbb0c82129392acf70 # v3.95.6
        with:
          extra_args: --only-verified

  docker-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Build application Docker image
        run: docker build -t core-graph-app:ci -f deploy/docker/Dockerfile.app .
      - name: Scan application image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: core-graph-app:ci
          format: table
          exit-code: "1"
          ignore-unfixed: "true"
          severity: CRITICAL
      - name: Generate container image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: core-graph-app:ci
          format: cyclonedx-json
          artifact-name: sbom-container.cyclonedx.json
      - name: Check for additional Dockerfiles
        id: check-pg
        run: |
          if [ -f deploy/docker/Dockerfile.postgres ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build PostgreSQL image
        if: steps.check-pg.outputs.found == 'true'
        run: docker build -t core-graph-pg:ci -f deploy/docker/Dockerfile.postgres .
      - name: Scan PostgreSQL image with Trivy
        if: steps.check-pg.outputs.found == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: core-graph-pg:ci
          format: table
          exit-code: "1"
          ignore-unfixed: "true"
          severity: CRITICAL
