name: Eval

# Eval runs against a populated DB. To keep PR CI fast and reliable we
# only schedule the heavy run nightly + on-demand, and on main pushes.
# The unit-test layer (tests/test_eval_runner.py, tests/test_embedding_drift.py)
# covers the pure helpers on every PR via the standard test workflow.
on:
  schedule:
    - cron: '17 3 * * *'  # 03:17 UTC nightly
  workflow_dispatch:
  push:
    branches: [main]

permissions: {}

jobs:
  retrieval-eval:
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    permissions:
      contents: read
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: cg_admin
      PGPASSWORD: cg_dev_only
      PGDATABASE: core_graph
      CG_PG_DSN: postgresql://cg_admin:cg_dev_only@localhost:5432/core_graph
      CG_NATS_URL: nats://localhost:4222
      CG_VALKEY_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: pip install '.[test]'
      - name: Start Docker Compose stack
        run: docker compose -f deploy/docker/docker-compose.yml up -d
      - name: Wait for PostgreSQL
        run: |
          for _ in $(seq 1 30); do
            if docker compose -f deploy/docker/docker-compose.yml exec -T postgres pg_isready -U cg_admin -d core_graph 2>/dev/null; then
              break
            fi
            sleep 2
          done
      - name: Apply migrations and seeds
        run: |
          sudo apt-get update -qq && sudo apt-get install -y postgresql-client
          for f in $(ls schema/migrations/*.sql | sort); do
            psql -v ON_ERROR_STOP=1 -f "$f"
          done
          for f in $(ls schema/seed/*.sql 2>/dev/null | sort); do
            psql -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Run retrieval eval
        run: |
          python scripts/eval/run_retrieval_eval.py \
            --golden tests/eval/golden/retrieval_v1.jsonl \
            --report-md eval-report.md \
            > eval-report.json
      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-eval-report
          path: |
            eval-report.json
            eval-report.md
      - name: RLS-aware retrieval correctness (hard fail)
        run: pytest tests/eval/test_rls_retrieval_correctness.py -v
      - name: Embedding drift detection
        run: |
          set +e
          python scripts/bench/embedding_drift.py \
            --baseline tests/eval/baseline_embedding_dist.npz \
            --sample-size 10000 \
            > drift-report.json
          rc=$?
          cat drift-report.json
          if [ "$rc" -ne 0 ]; then
            echo "drift exit code $rc"
            exit "$rc"
          fi
      - name: Upload drift report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: embedding-drift-report
          path: drift-report.json
      - name: Tear down stack
        if: always()
        run: docker compose -f deploy/docker/docker-compose.yml down -v
