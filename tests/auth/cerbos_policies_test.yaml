---
name: CoreGraphPolicies
description: Test suite for core-graph Cerbos resource policies
tests:
  # ------------------------------------------------------------------
  # threat_entity
  # ------------------------------------------------------------------
  - name: threat_entity — CISO can read TLP:RED
    input:
      principals: [ciso_user]
      resources: [threat_entity_red]
      actions: [read]
    expected:
      - principal: ciso_user
        resource: threat_entity_red
        actions:
          read: EFFECT_ALLOW

  - name: threat_entity — SOC analyst can read TLP:AMBER
    input:
      principals: [soc_user]
      resources: [threat_entity_amber]
      actions: [read]
    expected:
      - principal: soc_user
        resource: threat_entity_amber
        actions:
          read: EFFECT_ALLOW

  - name: threat_entity — SOC analyst cannot read TLP:RED
    input:
      principals: [soc_user]
      resources: [threat_entity_red]
      actions: [read]
    expected:
      - principal: soc_user
        resource: threat_entity_red
        actions:
          read: EFFECT_DENY

  - name: threat_entity — External auditor can read TLP:GREEN
    input:
      principals: [auditor_user]
      resources: [threat_entity_green]
      actions: [read]
    expected:
      - principal: auditor_user
        resource: threat_entity_green
        actions:
          read: EFFECT_ALLOW

  - name: threat_entity — External auditor cannot read TLP:AMBER
    input:
      principals: [auditor_user]
      resources: [threat_entity_amber]
      actions: [read]
    expected:
      - principal: auditor_user
        resource: threat_entity_amber
        actions:
          read: EFFECT_DENY

  - name: threat_entity — AI agent cannot read TLP:AMBER
    input:
      principals: [ai_user]
      resources: [threat_entity_amber]
      actions: [read]
    expected:
      - principal: ai_user
        resource: threat_entity_amber
        actions:
          read: EFFECT_DENY

  - name: threat_entity — AI agent cannot read TLP:RED
    input:
      principals: [ai_user]
      resources: [threat_entity_red]
      actions: [read]
    expected:
      - principal: ai_user
        resource: threat_entity_red
        actions:
          read: EFFECT_DENY

  # ------------------------------------------------------------------
  # evidence_record
  # ------------------------------------------------------------------
  - name: evidence_record — Compliance officer can read
    input:
      principals: [compliance_user]
      resources: [evidence_record_generic]
      actions: [read]
    expected:
      - principal: compliance_user
        resource: evidence_record_generic
        actions:
          read: EFFECT_ALLOW

  - name: evidence_record — IT operations cannot read
    input:
      principals: [it_ops_user]
      resources: [evidence_record_generic]
      actions: [read]
    expected:
      - principal: it_ops_user
        resource: evidence_record_generic
        actions:
          read: EFFECT_DENY

  # ------------------------------------------------------------------
  # identity_attribution
  # ------------------------------------------------------------------
  - name: identity_attribution — CISO can assert attribution
    input:
      principals: [ciso_user]
      resources: [identity_attribution_target]
      actions: [assert]
    expected:
      - principal: ciso_user
        resource: identity_attribution_target
        actions:
          assert: EFFECT_ALLOW

  - name: identity_attribution — AI agent cannot assert attribution
    input:
      principals: [ai_user]
      resources: [identity_attribution_target]
      actions: [assert]
    expected:
      - principal: ai_user
        resource: identity_attribution_target
        actions:
          assert: EFFECT_DENY

  - name: identity_attribution — SOC analyst cannot assert attribution
    input:
      principals: [soc_user]
      resources: [identity_attribution_target]
      actions: [assert]
    expected:
      - principal: soc_user
        resource: identity_attribution_target
        actions:
          assert: EFFECT_DENY

  - name: identity_attribution — Compliance officer cannot assert attribution
    input:
      principals: [compliance_user]
      resources: [identity_attribution_target]
      actions: [assert]
    expected:
      - principal: compliance_user
        resource: identity_attribution_target
        actions:
          assert: EFFECT_DENY

  - name: identity_attribution — IT operations cannot assert attribution
    input:
      principals: [it_ops_user]
      resources: [identity_attribution_target]
      actions: [assert]
    expected:
      - principal: it_ops_user
        resource: identity_attribution_target
        actions:
          assert: EFFECT_DENY

  - name: identity_attribution — DPO cannot assert attribution
    input:
      principals: [dpo_user]
      resources: [identity_attribution_target]
      actions: [assert]
    expected:
      - principal: dpo_user
        resource: identity_attribution_target
        actions:
          assert: EFFECT_DENY

  - name: identity_attribution — External auditor cannot assert attribution
    input:
      principals: [auditor_user]
      resources: [identity_attribution_target]
      actions: [assert]
    expected:
      - principal: auditor_user
        resource: identity_attribution_target
        actions:
          assert: EFFECT_DENY

  # ------------------------------------------------------------------
  # incident
  # ------------------------------------------------------------------
  - name: incident — SOC analyst can read own assigned incident
    input:
      principals: [soc_user]
      resources: [incident_assigned_to_soc]
      actions: [read]
    expected:
      - principal: soc_user
        resource: incident_assigned_to_soc
        actions:
          read: EFFECT_ALLOW

  - name: incident — SOC analyst cannot read incident assigned to other
    input:
      principals: [soc_user]
      resources: [incident_assigned_to_other]
      actions: [read]
    expected:
      - principal: soc_user
        resource: incident_assigned_to_other
        actions:
          read: EFFECT_DENY

# Principal roles use the bare role names the OIDC IdP emits, matched verbatim
# by the derived-role parentRoles in policies/derived_roles.yaml. Do not add a
# cg_ prefix here (see ADR-0008 decision 5).

  # ------------------------------------------------------------------
  # memory (Layer 5) — the resource ADR-0016 required before ai_agent
  # could regain write. Migration 042's grant derives from these rules.
  # ------------------------------------------------------------------
  - name: memory — AI agent can create and update its own memory
    input:
      principals: [ai_user]
      resources: [memory_episode]
      actions: [read, create, update]
    expected:
      - principal: ai_user
        resource: memory_episode
        actions:
          read: EFFECT_ALLOW
          create: EFFECT_ALLOW
          update: EFFECT_ALLOW

  - name: memory — AI agent cannot delete; memory is bitemporal
    input:
      principals: [ai_user]
      resources: [memory_episode]
      actions: [delete]
    expected:
      - principal: ai_user
        resource: memory_episode
        actions:
          delete: EFFECT_DENY

  - name: memory — CISO retains full access
    input:
      principals: [ciso_user]
      resources: [memory_episode]
      actions: [read, create, update, delete]
    expected:
      - principal: ciso_user
        resource: memory_episode
        actions:
          read: EFFECT_ALLOW
          create: EFFECT_ALLOW
          update: EFFECT_ALLOW
          delete: EFFECT_ALLOW

  - name: memory — SOC analyst may read but not write
    input:
      principals: [soc_user]
      resources: [memory_episode]
      actions: [read, create, update]
    expected:
      - principal: soc_user
        resource: memory_episode
        actions:
          read: EFFECT_ALLOW
          create: EFFECT_DENY
          update: EFFECT_DENY

  - name: memory — external auditor and DPO may not write
    input:
      principals: [auditor_user, dpo_user]
      resources: [memory_episode]
      actions: [create, update]
    expected:
      - principal: auditor_user
        resource: memory_episode
        actions:
          create: EFFECT_DENY
          update: EFFECT_DENY
      - principal: dpo_user
        resource: memory_episode
        actions:
          create: EFFECT_DENY
          update: EFFECT_DENY

principals:
  ciso_user:
    id: ciso_user
    roles: [ciso]
    attr: {}

  soc_user:
    id: soc_user
    roles: [soc_analyst]
    attr:
      case_id: case-001

  compliance_user:
    id: compliance_user
    roles: [compliance_officer]
    attr: {}

  it_ops_user:
    id: it_ops_user
    roles: [it_operations]
    attr: {}

  auditor_user:
    id: auditor_user
    roles: [external_auditor]
    attr: {}

  ai_user:
    id: ai_user
    roles: [ai_agent]
    attr: {}

  dpo_user:
    id: dpo_user
    roles: [dpo]
    attr: {}

resources:
  memory_episode:
    kind: memory
    id: mem-ep-001
    attr:
      session_id: sess-001
      tlp_level: 1
  # TLP encoding aligned to integer schema: 0=CLEAR, 1=GREEN, 2=AMBER, 3=AMBER+STRICT, 4=RED
  threat_entity_red:
    kind: threat_entity
    id: te-red-001
    attr:
      tlp_level: 4

  threat_entity_amber:
    kind: threat_entity
    id: te-amber-001
    attr:
      tlp_level: 2

  threat_entity_green:
    kind: threat_entity
    id: te-green-001
    attr:
      tlp_level: 1

  evidence_record_generic:
    kind: evidence_record
    id: ev-001
    attr:
      record_type: audit_log

  identity_attribution_target:
    kind: identity_attribution
    id: ia-001
    attr: {}

  incident_assigned_to_soc:
    kind: incident
    id: inc-001
    attr:
      assigned_to: soc_user
      category: malware
      contains_pii: false

  incident_assigned_to_other:
    kind: incident
    id: inc-002
    attr:
      assigned_to: other_analyst
      category: malware
      contains_pii: false
