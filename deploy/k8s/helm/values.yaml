# Core-Graph Helm Chart — Lab Defaults
# Override with values-prod.yaml for production deployments.

global:
  profile: lab  # lab | prod
  imageRegistry: ghcr.io
  imagePullSecrets: []
  nodeSelector: {}
  tolerations: []
  waitForImage: "busybox:1.38@sha256:fd8d9aa63ba2f0982b5304e1ee8d3b90a210bc1ffb5314d980eb6962f1a9715d"  # Override for air-gapped registries

# ---------------------------------------------------------------------------
# API — FastAPI REST server (port 8000)
# ---------------------------------------------------------------------------
api:
  replicaCount: 2
  image:
    repository: rmednitzer/core-graph
    tag: ""  # defaults to Chart.appVersion
    pullPolicy: IfNotPresent
  port: 8000
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPU: 70
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts: []
    #  - host: core-graph.example.com
    #    paths:
    #      - path: /
    #        pathType: Prefix
    tls: []
  # Non-secret CG_* environment variables.
  # CG_PG_DSN, CG_NATS_URL, CG_VALKEY_URL are auto-resolved from dependency config.
  config:
    CG_DEFAULT_TLP: "2"
    CG_OIDC_ENABLED: "false"
    CG_CORS_ORIGINS: "*"
  podAnnotations: {}

# ---------------------------------------------------------------------------
# Graph Writer — NATS JetStream consumer → AGE graph
# ---------------------------------------------------------------------------
graphWriter:
  replicaCount: 1
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi

# ---------------------------------------------------------------------------
# Enrichment Worker — NATS ingest.* → enriched.* normalisation
# (opencti / misp / osint / wazuh feeds → graph-writable entities)
# ---------------------------------------------------------------------------
enrichmentWorker:
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# ---------------------------------------------------------------------------
# PostgreSQL 18 — graph store (AGE), vector store (pgvector), audit log
# Set enabled=false and configure external.* to use an external instance.
# ---------------------------------------------------------------------------
postgres:
  enabled: true
  # Image must bundle Apache AGE, pgvector, pgaudit, and pg_cron.
  # Built from deploy/docker/Dockerfile.postgres.
  image:
    repository: rmednitzer/core-graph-postgres
    tag: "18-extensions"
  storage: 10Gi
  storageClass: ""
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi
  auth:
    database: core_graph
    username: cg_admin
    password: changeme  # Override via --set in production
  external:
    host: ""
    port: 5432
    password: ""

# ---------------------------------------------------------------------------
# NATS JetStream — message bus for enriched entities
# Set enabled=false and configure external.* to use an external cluster.
# ---------------------------------------------------------------------------
nats:
  enabled: true
  image:
    repository: nats
    tag: "2.14@sha256:67ac7866d010e8d83302dd30332eeae1a2b7a8ee051155e2eb5a5485b720cd4b"
  storageClass: ""
  jetstream:
    maxMem: 256MB
    # Must cover the sum of every stream's max_bytes. The three canonical
    # work-queue streams (ENRICHED, INGEST, DLQ in ingest.streams) reserve
    # 1 GiB each, so the account file store needs >3 GiB of headroom (kept
    # below the PVC `storage` below).
    maxFile: 4GB
    syncInterval: "always"
    storage: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    # JetStream maxMem is 256MB; the pod limit leaves headroom above it.
    limits:
      cpu: "1"
      memory: 512Mi

  external:
    url: ""

# ---------------------------------------------------------------------------
# Valkey (Redis) — caching layer
# Set enabled=false and configure external.* to use an external instance.
# ---------------------------------------------------------------------------
valkey:
  enabled: true
  image:
    repository: valkey/valkey
    tag: "9@sha256:8e8d64b405ce18f41b8e5ee20aa4687a8ed0022d1298f2ce31cdcf3a76e09411"
  storage: 1Gi
  storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  external:
    url: ""

# ---------------------------------------------------------------------------
# Network Policy — default-deny + per-component rules
# ---------------------------------------------------------------------------
networkPolicy:
  enabled: true
