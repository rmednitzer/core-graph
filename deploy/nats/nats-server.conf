# NATS server configuration for core-graph local development.
# No authentication for local dev (add auth in production overlay).

listen: 0.0.0.0:4222

http_port: 8222

jetstream {
    store_dir: /data/jetstream
    max_mem: 256MB
    # Must cover the sum of every stream's max_bytes. The three canonical
    # work-queue streams (ENRICHED, INGEST, DLQ in ingest.streams) reserve
    # 1 GiB each, so the account file store needs >3 GiB of headroom.
    max_file: 4GB
    sync_interval: always
}
