name: Setup PostgreSQL with AGE + extensions
description: >-
  Builds and starts a PostgreSQL 18 container based on apache/age with
  pgvector, pgaudit, and pg_cron installed and the necessary
  shared_preload_libraries enabled.

inputs:
  postgres-user:
    description: PostgreSQL superuser
    required: false
    default: postgres
  postgres-password:
    description: PostgreSQL superuser password
    required: false
    default: postgres
  postgres-db:
    description: Database to create on first start
    required: false
    default: core_graph_test

runs:
  using: composite
  steps:
    - name: Build and start PostgreSQL with AGE + pgvector + pgaudit + pg_cron
      shell: bash
      env:
        POSTGRES_USER: ${{ inputs.postgres-user }}
        POSTGRES_PASSWORD: ${{ inputs.postgres-password }}
        POSTGRES_DB: ${{ inputs.postgres-db }}
      run: |
        set -euo pipefail
        docker run -d --name pgsetup \
          -e POSTGRES_USER \
          -e POSTGRES_PASSWORD \
          -e POSTGRES_DB \
          apache/age:release_PG18_1.7.0
        until docker exec pgsetup pg_isready -U "$POSTGRES_USER"; do sleep 1; done
        # Install pgaudit + pg_cron from Debian; fetch pgvector v0.8.2
        # source as a tarball (avoids depending on git inside the
        # container, which exhibited intermittent exit 128 in CI). The
        # pgvector source is small (~200 KB) so curl is faster anyway.
        # Mirrors the spirit of deploy/docker/Dockerfile.postgres.
        #
        # The tarball is downloaded to a local file and verified against
        # an in-action SHA-256 before extraction (SLSA Build Track L3:
        # build steps consume only checksum-pinned inputs). Bump the
        # PGVECTOR_TAG and PGVECTOR_SHA256 together when upgrading.
        docker exec pgsetup bash -c '
          set -euo pipefail
          PGVECTOR_TAG=v0.8.2
          PGVECTOR_SHA256=69f4019389af05dc1c9548deb8628e62878e6e207c03907f2b8af2016472cdaa
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            build-essential curl ca-certificates postgresql-server-dev-18 \
            postgresql-18-pgaudit postgresql-18-cron
          mkdir -p /tmp/pgvector
          # Retry flags mirror deploy/docker/Dockerfile.postgres; see the
          # comment there. Safe because the checksum is verified on the next
          # line, so a partial body fails loudly rather than being retried into
          # the build.
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
            -o /tmp/pgvector.tar.gz \
            "https://github.com/pgvector/pgvector/archive/refs/tags/${PGVECTOR_TAG}.tar.gz"
          echo "${PGVECTOR_SHA256}  /tmp/pgvector.tar.gz" | sha256sum -c -
          tar xz -C /tmp/pgvector --strip-components=1 -f /tmp/pgvector.tar.gz
          rm /tmp/pgvector.tar.gz
          cd /tmp/pgvector && make && make install
          cd / && rm -rf /tmp/pgvector
          apt-get purge -y --auto-remove build-essential curl postgresql-server-dev-18
          apt-get clean && rm -rf /var/lib/apt/lists/*
        '
        docker stop pgsetup
        docker commit pgsetup age-full
        docker rm pgsetup

        docker run -d --name pgtest -p 5432:5432 \
          -e POSTGRES_USER \
          -e POSTGRES_PASSWORD \
          -e POSTGRES_DB \
          age-full \
          postgres -c shared_preload_libraries='age,pgaudit,pg_cron' \
            -c cron.database_name="$POSTGRES_DB"
        until docker exec pgtest pg_isready -U "$POSTGRES_USER"; do sleep 1; done

    - name: Install PostgreSQL client
      shell: bash
      run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
