name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  schema-and-rls-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: core_graph_test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up PostgreSQL with AGE + extensions
        uses: ./.github/actions/setup-pg-age
      - name: Run migrations
        run: bash tests/schema/test_migrations.sh
      - name: Verify extensions exist
        run: |
          required_extensions=("age" "vector" "pgaudit" "pg_cron")
          for ext in "${required_extensions[@]}"; do
            if ! psql -tAc "SELECT 1 FROM pg_extension WHERE extname = '${ext}'" | grep -q 1; then
              echo "Required extension '${ext}' is not installed"
              exit 1
            fi
          done
      - name: Run TLP enforcement RLS test
        run: psql -v ON_ERROR_STOP=1 -f tests/rls/test_tlp_enforcement.sql
      - name: Run edge-TLP RLS test
        run: psql -v ON_ERROR_STOP=1 -f tests/rls/test_edge_tlp.sql
      - name: Run IAM TLP-floor RLS test
        run: psql -v ON_ERROR_STOP=1 -f tests/rls/test_iam_tlp_floor.sql
      - name: Run write-path RLS test
        run: psql -v ON_ERROR_STOP=1 -f tests/rls/test_write_path.sql
      - name: Run STIX SDO RLS test
        run: psql -v ON_ERROR_STOP=1 -f tests/rls/test_stix_sdo_rls.sql
      # The vector tier had no policy at all until 037. The end-to-end
      # equivalent, tests/eval/test_rls_retrieval_correctness.py, needs an
      # embedding provider and so never runs in CI; this one needs only psql.
      - name: Run vector-tier TLP RLS test
        run: psql -v ON_ERROR_STOP=1 -f tests/rls/test_vector_tlp.sql
      # Every other suite here creates its own non-superuser role, which proves
      # the policies correct without proving the application ever reaches them.
      # This one asserts the property those suites assume, against the role
      # migration 038 creates for the application to connect as.
      - name: Run application-role RLS test
        run: psql -v ON_ERROR_STOP=1 -f tests/rls/test_application_role.sql

  policy-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Cerbos CLI
        env:
          # Pinned, not discovered from the GitHub API at runtime. The
          # unauthenticated releases/latest endpoint is rate-limited (60 req/h
          # per IP, shared across GitHub-hosted runners); an exhausted limit
          # returns an error body, leaving CERBOS_VERSION empty and breaking the
          # install non-deterministically. Pinning also keeps policy-compilation
          # behaviour reproducible. Bump deliberately (Renovate does not track
          # this shell download).
          CERBOS_VERSION: v0.53.0
        run: |
          mkdir -p "$HOME/.local/bin"
          # Retry flags per ADR-0014's companion fix (#111): every CI job here
          # fetches a release asset from github.com at run time, and four such
          # fetches failed with 503 or a dropped connection inside one hour on
          # 2026-08-12. Exponential backoff (no --retry-delay, which would
          # disable it), bounded so a real outage still fails rather than hangs.
          curl -fsSL --retry 8 --retry-all-errors --retry-max-time 180 \
            "https://github.com/cerbos/cerbos/releases/download/${CERBOS_VERSION}/cerbos_${CERBOS_VERSION#v}_Linux_x86_64.tar.gz" \
            | tar xz -C "$HOME/.local/bin" cerbos
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          cerbos --version
      - name: Compile and test policies
        run: cerbos compile --tests=tests/auth policies/

  python-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: pip install '.[test]'
      # Coverage floor lives in pyproject.toml [tool.coverage.report]
      # fail_under, so local `pytest --cov` runs enforce the same ratchet.
      - name: Run pytest (with coverage floor)
        run: >
          pytest -m "not integration"
          --cov=api --cov=ingest --cov=evidence
          --cov-report=term --cov-report=xml
      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage.xml
          path: coverage.xml

  taxii-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: pip install '.[test]'
      - name: Run TAXII endpoint tests
        run: pytest tests/taxii/ -v

  integration-test:
    runs-on: ubuntu-latest
    # Runs on PRs as well as push-to-main. Previously main-only, which is why
    # the PG18 postgres-volume breakage (and #48's collection error before it)
    # stayed invisible until after merge — the full-stack path was never
    # exercised pre-merge. The CI-time cost (building the app + AGE/pgvector
    # images and standing up the stack) is the price of catching stack/ingest
    # regressions in review rather than on main.
    permissions:
      contents: read
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: cg_admin
      PGPASSWORD: cg_dev_only
      PGDATABASE: core_graph
      # The serving pool connects as cg_app (migration 038), not as the owner,
      # so the integration suite exercises the real read and write paths with
      # RLS actually evaluated. That is what proves the grant surface complete.
      CG_PG_DSN: postgresql://cg_admin:cg_dev_only@localhost:5432/core_graph
      CG_PG_APP_DSN: postgresql://cg_app:cg_dev_only_app@localhost:5432/core_graph
      CG_NATS_URL: nats://localhost:4222
      CG_VALKEY_URL: redis://localhost:6379
      # The REST integration tests drive the app in-process, so they need the
      # same auth posture the compose api service uses: OIDC off with the
      # synthetic dev identity (otherwise /api/v1/* fails closed). Read once at
      # api.config import, so it must be set before pytest starts.
      CG_OIDC_ENABLED: "false"
      CG_DEV_MODE: "true"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: pip install '.[test]'
      - name: Start Docker Compose stack
        run: docker compose -f deploy/docker/docker-compose.yml up -d
      - name: Wait for health checks
        run: |
          echo "Waiting for PostgreSQL..."
          ready=false
          for _ in $(seq 1 30); do
            if docker compose -f deploy/docker/docker-compose.yml exec -T postgres pg_isready -U cg_admin -d core_graph 2>/dev/null; then
              ready=true; break
            fi
            sleep 2
          done
          [ "$ready" = true ] || { echo "PostgreSQL did not become ready in time" >&2; exit 1; }
          echo "Waiting for NATS..."
          ready=false
          for _ in $(seq 1 15); do
            if curl -sf http://localhost:8222/healthz >/dev/null 2>&1; then
              ready=true; break
            fi
            sleep 2
          done
          [ "$ready" = true ] || { echo "NATS did not become ready in time" >&2; exit 1; }
          echo "Waiting for Valkey..."
          ready=false
          for _ in $(seq 1 15); do
            if docker compose -f deploy/docker/docker-compose.yml exec -T valkey valkey-cli ping 2>/dev/null | grep -q PONG; then
              ready=true; break
            fi
            sleep 2
          done
          [ "$ready" = true ] || { echo "Valkey did not become ready in time" >&2; exit 1; }
      - name: Run migrations and seeds
        run: |
          sudo apt-get update -qq && sudo apt-get install -y postgresql-client
          for f in $(ls schema/migrations/*.sql | sort); do
            psql -v ON_ERROR_STOP=1 -f "$f"
          done
          for f in $(ls schema/seed/*.sql 2>/dev/null | sort); do
            psql -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Run integration tests
        run: pytest -m integration -v
      # The stack's own stderr never reaches this log otherwise. A postgres
      # container that dies during initdb (a failing migration, a bad
      # entrypoint script) shows up only as "dependency failed to start:
      # container cg-postgres exited (1)", which says nothing about why.
      - name: Dump stack logs on failure
        if: failure()
        run: docker compose -f deploy/docker/docker-compose.yml logs --no-color --tail=200
      - name: Tear down stack
        if: always()
        run: docker compose -f deploy/docker/docker-compose.yml down -v
