# Connection security
ssl = on
ssl_cert_file = '/etc/ssl/certs/server.crt'
ssl_key_file = '/etc/ssl/private/server.key'
ssl_min_protocol_version = 'TLSv1.3'
password_encryption = 'scram-sha-256'

# Connection limits
max_connections = 100
superuser_reserved_connections = 3

# Logging (pgAudit). `role` is included so that GRANT/REVOKE and role
# membership changes are audited alongside DDL; those are the events an
# access-control review needs, and pgAudit does not log them under `ddl`.
pgaudit.log = 'ddl,role,write'
pgaudit.log_catalog = off
pgaudit.log_level = 'log'
pgaudit.log_parameter = on
pgaudit.log_statement_once = on

# Query and connection evidence (bounded; pgAudit does not cover these).
# log_connections takes the PostgreSQL 18 list form; 'authorization' logs
# the authenticated identity without the per-connection startup noise.
track_io_timing = on
log_min_duration_statement = 1000
log_lock_waits = on
deadlock_timeout = '1s'
log_connections = 'authorization'
log_disconnections = on

# Session limits. Only idle_in_transaction_session_timeout is global.
# statement_timeout is set on the request-serving role instead (migration
# 043, ALTER ROLE cg_app), and api.db additionally sets a role-derived
# ceiling on every pooled connection. A global 30s ceiling would also apply
# to the owner identity that runs migrations and builds HNSW indexes, and
# to pg_cron jobs, none of which should be cut off at 30s.
idle_in_transaction_session_timeout = '60s'

# Memory
shared_buffers = '256MB'
work_mem = '16MB'
maintenance_work_mem = '128MB'
effective_cache_size = '1GB'

# WAL
wal_level = 'replica'
max_wal_senders = 5
wal_keep_size = '1GB'

# Checkpointing
checkpoint_timeout = '10min'
checkpoint_completion_target = 0.9

# Preloaded extensions. pg_stat_statements is the query-performance
# evidence source (migration 043 creates the extension); it must be
# preloaded here or the view raises at query time.
shared_preload_libraries = 'age,pgaudit,pg_cron,pg_stat_statements'
cron.database_name = 'core_graph'
# Run cron jobs in background workers instead of a libpq connection to
# localhost. With the hardened pg_hba above (no cleartext TCP, no trust),
# the connection form has no credential to present and every job fails
# to authenticate; background workers need no connection at all.
cron.use_background_workers = on
