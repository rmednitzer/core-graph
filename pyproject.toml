[build-system]
requires = ["setuptools>=78.1.1"]
build-backend = "setuptools.build_meta"

[project]
name = "core-graph"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "psycopg[binary]>=3.1,<4",
  "nats-py>=2.14.0,<3",
  "redis>=7.4.0,<9",
  "pydantic>=2.5,<3",
  "mcp>=2,<3",
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.27,<1",
  "httpx>=0.27,<1",
  "pyyaml>=6.0,<7",
  "PyJWT[crypto]>=2.12.1,<3",
  "authzed>=1.0,<2",
  "cerbos>=0.10,<1",
  "pyzmq>=25.0,<28",
  "minio>=7.2,<8",
  "prometheus-client>=0.25.0,<1",
  "psycopg-pool>=3.2,<4",
  "rfc3161ng>=2.1,<3",
]

[project.optional-dependencies]
test = [
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=0.23,<2",
  "pytest-cov>=6.0,<8",
  "jellyfish>=1.0,<2",
  "httpx>=0.27,<1",
]
misp = [
  "misp-stix>=2.4",
]
dev = [
  "ruff>=0.4,<0.17",
  "yamllint>=1.35,<2",
  "mypy>=1.14,<3",
]

[tool.setuptools.packages.find]
include = ["ingest", "ingest.*", "api", "api.*", "evidence", "evidence.*", "scripts"]

[tool.setuptools.package-data]
# The MCP cypher_query tool loads its named templates from these data files at
# import time; without this a pip-installed copy ships an empty template
# registry (caught by tests/integration/test_cypher_templates.py).
"api.mcp.skills.queries" = ["*.cypher", "*.json"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "S"]
ignore = ["S101", "S104", "S603", "S607", "S608"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S106"]
"scripts/bench/**" = ["S110", "S311"]

[tool.mypy]
# Deliberately permissive first cut (audit 2026-06-01 § 6.3): catch the
# call-shape and Optional-handling bug classes without demanding annotations
# everywhere. Tighten incrementally (e.g. disallow_untyped_defs per package)
# rather than all at once. Scope: service code; tests are excluded.
python_version = "3.13"
files = ["api", "ingest", "evidence"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.coverage.report]
# Soft ratchet (audit 2026-06-01 § 6.4): two points under the unit-suite
# baseline measured at introduction (50% — the ingest writers/connectors are
# exercised by the integration job, which does not feed this number). Raise as
# the baseline rises; never lower it to admit a regression. Enforced wherever
# pytest runs with --cov, locally and in CI.
fail_under = 48

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
asyncio_mode = "strict"
markers = [
    "integration: requires running Docker stack (deselect with '-m not integration')",
]
