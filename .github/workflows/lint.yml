name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  python-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  # Audit 2026-06-01 § 6.3 planned this as non-blocking-first; the tree is
  # mypy-clean under the permissive [tool.mypy] config (the 9 findings it
  # surfaced — including a FastMCP startup TypeError and a SpiceDB protobuf
  # wire error — were fixed in the same change), so the gate is blocking
  # from the start. Tighten [tool.mypy] incrementally, not this job.
  typecheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project + mypy
        # dev extra only: mypy checks api/ingest/evidence, none of which
        # import the test extra's packages.
        run: pip install '.[dev]'
      - name: mypy
        run: mypy

  # ADR-0009: uv.lock is the reproducibility record for the loose floors in
  # pyproject.toml. This is deliberately a *networked* check — the lock must be
  # verified against the real index, not a half-offline approximation.
  lockfile-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Install uv (pinned)
        run: pip install uv==0.8.17
      - name: Verify uv.lock is in sync with pyproject.toml
        run: uv lock --check

  yaml-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - run: pip install yamllint
      - run: >
          yamllint
          -d '{extends: default, rules: {line-length: {max: 120}}}'
          policies/ artifact-index.yaml

  sql-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Validate SQL files are valid UTF-8 and end with a newline
        run: |
          set -euo pipefail
          failed=0
          for f in schema/migrations/*.sql schema/seed/*.sql; do
            [ -f "$f" ] || continue
            # UTF-8 check
            if ! iconv -f utf-8 -t utf-8 "$f" > /dev/null 2>&1; then
              echo "ERROR: $f is not valid UTF-8"
              failed=1
            fi
            # Trailing newline check
            if [ -n "$(tail -c1 "$f")" ]; then
              echo "ERROR: $f does not end with a newline"
              failed=1
            fi
          done
          exit $failed
      - name: Validate migration file naming (NNN_*.sql, sequential from 001)
        run: |
          set -euo pipefail
          expected=1
          for f in $(ls schema/migrations/*.sql 2>/dev/null | sort); do
            base=$(basename "$f")
            num=$(echo "$base" | grep -oP '^\d+')
            if [ -z "$num" ]; then
              echo "ERROR: $f does not start with a number"
              exit 1
            fi
            got=$((10#$num))
            if [ "$got" -ne "$expected" ]; then
              echo "ERROR: expected migration $(printf '%03d' $expected) but found $base"
              exit 1
            fi
            expected=$((expected + 1))
          done
          echo "Migration numbering OK ($(( expected - 1 )) file(s))"

  markdown-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: DavidAnson/markdownlint-cli2-action@ded1f9488f68a970bc66ea5619e13e9b52e601cd # v23
        with:
          config: .markdownlint.yml
          globs: "**/*.md"

  helm-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v3.21.2
      - name: Helm lint (lab profile)
        run: helm lint deploy/k8s/helm
      - name: Helm lint (prod profile)
        run: helm lint deploy/k8s/helm -f deploy/k8s/helm/values.yaml -f deploy/k8s/helm/values-prod.yaml
      - name: Helm template (lab profile)
        run: helm template core-graph deploy/k8s/helm --debug > /dev/null
      - name: Helm template (prod profile)
        run: helm template core-graph deploy/k8s/helm -f deploy/k8s/helm/values.yaml -f deploy/k8s/helm/values-prod.yaml --debug > /dev/null

  kubeconform:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v3.21.2
      - name: Install kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/
      - name: Validate manifests (lab profile)
        run: |
          helm template core-graph deploy/k8s/helm | kubeconform \
            -strict \
            -summary \
            -kubernetes-version 1.32.0 \
            -skip CustomResourceDefinition
      - name: Validate manifests (prod profile)
        run: |
          helm template core-graph deploy/k8s/helm \
            -f deploy/k8s/helm/values.yaml \
            -f deploy/k8s/helm/values-prod.yaml | kubeconform \
            -strict \
            -summary \
            -kubernetes-version 1.32.0 \
            -skip CustomResourceDefinition

  zarf-validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - run: pip install check-jsonschema
      - name: Validate zarf.yaml against Zarf schema
        run: |
          check-jsonschema \
            --schemafile "https://raw.githubusercontent.com/zarf-dev/zarf/main/zarf.schema.json" \
            zarf.yaml

  # Lint the workflow files themselves. This is the only job that validates
  # release.yml (which otherwise runs solely on `release: published`), and it
  # catches invalid action refs, expression/syntax errors, and — via shellcheck
  # (preinstalled on ubuntu-latest) — bugs in `run:` scripts, before they reach
  # a workflow that is hard to exercise in CI.
  actionlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Install actionlint
        env:
          # Pinned + checksum-verified (SLSA: consume only checksum-pinned
          # inputs). Bump both together; Renovate does not track this shell
          # download.
          ACTIONLINT_VERSION: v1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -fsSL -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION#v}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar xzf /tmp/actionlint.tar.gz actionlint
          sudo mv actionlint /usr/local/bin/
      - name: Lint workflows
        # SC2012 (prefer find over ls) is excluded: the only `ls` uses target
        # schema/migrations/*.sql + schema/seed/*.sql, whose names are
        # NNN_<slug>.sql by the migration-numbering rule, so the
        # non-alphanumeric-filename concern does not apply.
        env:
          SHELLCHECK_OPTS: --exclude=SC2012
        run: actionlint -color
