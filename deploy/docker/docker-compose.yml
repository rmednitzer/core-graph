# Local development stack for core-graph.
# Usage: docker compose -f deploy/docker/docker-compose.yml up -d

services:
  api:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.app
    container_name: cg-api
    ports:
      - "8000:8000"
    environment:
      CG_PG_DSN: postgresql://cg_admin:cg_dev_only@postgres:5432/core_graph
      CG_NATS_URL: nats://nats:4222
      CG_VALKEY_URL: redis://valkey:6379
      CG_OIDC_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        # The official nats image is distroless (no shell/wget), so it has no
        # in-container healthcheck; gate on the container being started. nats
        # binds its port in <1s and the app's NATS client reconnects.
        condition: service_started
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - core-graph

  postgres:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.postgres
    container_name: cg-postgres
    environment:
      POSTGRES_USER: cg_admin
      POSTGRES_PASSWORD: cg_dev_only
      POSTGRES_DB: core_graph
    ports:
      - "5432:5432"
    volumes:
      # PostgreSQL 18 images store data under /var/lib/postgresql/<major>/ and
      # the entrypoint refuses to start when a volume is mounted at the legacy
      # /var/lib/postgresql/data path. Mount the parent so PGDATA lives on the
      # volume (/var/lib/postgresql/18/docker).
      - pgdata:/var/lib/postgresql
    command: >
      postgres
      -c shared_preload_libraries='age,pgaudit,pg_cron'
      -c cron.database_name=core_graph
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cg_admin -d core_graph"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - core-graph

  nats:
    image: nats:latest@sha256:bbfbb6c4cdaeb8a2e3ca57d3de30463a66a6c5181f324f3b680bcf858833d377
    container_name: cg-nats
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - ../nats/nats-server.conf:/etc/nats/nats-server.conf:ro
      - natsdata:/data
    command: ["--config", "/etc/nats/nats-server.conf"]
    # No healthcheck: the official nats image is distroless (no /bin/sh, no
    # wget/curl), so a CMD-SHELL probe fails with "exec: /bin/sh: no such file"
    # and the container is wrongly reported unhealthy. Readiness is verified by
    # the CI wait step (curl http://localhost:8222/healthz from the runner) and
    # by the Kubernetes httpGet probes in the Helm chart.
    networks:
      - core-graph

  valkey:
    image: valkey/valkey:latest@sha256:4963247afc4cd33c7d3b2d2816b9f7f8eeebab148d29056c2ca4d7cbc966f2d9
    container_name: cg-valkey
    ports:
      - "6379:6379"
    volumes:
      - valkeydata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - core-graph

  spicedb:
    image: authzed/spicedb:latest@sha256:830527f85ac4cb40aaf3d3e8e3fe0b84cdace5ee81ceb43f905b3822ee580b82
    container_name: cg-spicedb
    command: serve --grpc-preshared-key=cg_dev_only --datastore-engine=memory
    ports:
      - "50051:50051"
    networks:
      - core-graph

  cerbos:
    image: ghcr.io/cerbos/cerbos:latest@sha256:c3fe64202e3793b7e9c41c5cbfcf390a51fb28ebce0a7d70754155e70db839c4
    container_name: cg-cerbos
    ports:
      - "3593:3593"
    volumes:
      - ../../policies:/policies:ro
    command: ["server", "--set=storage.driver=disk", "--set=storage.disk.directory=/policies"]
    networks:
      - core-graph

  minio:
    image: minio/minio:latest@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: cg-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: cg_admin
      MINIO_ROOT_PASSWORD: cg_dev_only_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - core-graph

  prometheus:
    image: prom/prometheus:latest@sha256:a75c5a35bc21d7afe69551eefa3cb1e1fb1775fe759408007a66b54ec3de1f29
    container_name: cg-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - core-graph

  grafana:
    image: grafana/grafana:latest@sha256:121a7a9ece6dc10b969f1f96eed64b4f07dfac0d0b8abc070f7cb83bbde86f63
    container_name: cg-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: cg_dev_only
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - core-graph

volumes:
  pgdata:
  natsdata:
  valkeydata:
  miniodata:

networks:
  core-graph:
    driver: bridge
